name = "rankaloc"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# One KV namespace holds every scan as a single JSON value, key "scan:<id>".
# Create it with `npx wrangler kv namespace create SCANS` and paste the id below.
# `wrangler dev` runs against a local simulated KV, so the placeholder id is fine locally.
[[kv_namespaces]]
binding = "SCANS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
